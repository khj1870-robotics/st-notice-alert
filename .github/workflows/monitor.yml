name: SeoulTech Notice Monitor

on:
  schedule:
    - cron: '7 9,13,18 * * 1-5'
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send Telegram test message only"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
        run: python monitor.py

      - name: Commit seen state
        if: github.event.inputs.test_message != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen notices"
          git push
